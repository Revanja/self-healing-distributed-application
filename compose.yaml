services:
  payment-service:
    build: ./services/payment-service
    ports: ["8082:8082"]

  order-service:
    build: ./services/order-service
    ports: ["8081:8081"]
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8082
    depends_on:
      - payment-service

  reliability-controller:
    build: ./services/reliability-controller
    ports: ["8083:8083"]
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:8082
      ORDER_SERVICE_URL: http://order-service:8081
    depends_on:
      - payment-service
      - order-service
